[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "getzilla-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.4", "httpx==0.28.1", "uvicorn==0.48.0", "psycopg[binary]==3.3.4", "pypdf==6.19.0"]

[project.scripts]
getzilla-factory = "getzilla_factory.cli:main"
getzilla-factory-server = "getzilla_factory.server:main"
getzilla-factory-result-dispatch = "getzilla_factory.result_dispatch_cli:main"
getzilla-factory-admin = "getzilla_factory.admin:main"
getzilla-landing-server = "getzilla_factory.landing_host:main"
getzilla-landing-state = "getzilla_factory.landing_backup:main"
getzilla-landing-submit = "getzilla_factory.landing_failover_cli:main"

[tool.setuptools.package-data]
getzilla_factory = ["resources/*.json", "resources/*.sql", "resources/landing_pdf_worker.py"]
