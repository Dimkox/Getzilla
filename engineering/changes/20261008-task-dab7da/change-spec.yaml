  "acceptance_criteria": [
    {
      "id": "AC-001",
      "statement": "git-core helper binaries (git-push, git-send-pack, git-http-push, git-remote-*) and alias/nested command definitions are classified as production authority and blocked without an exact grant.",
      "evidence": [
        {
          "test": "tests/test_policy_hardening.py"
        },
        {
          "receipt": "security_review"
        }
      ]
    },
    {
      "id": "AC-002",
      "statement": "Recursive removes are detected across GNU long-option abbreviations, --no-preserve-root, Windows del/rd /s and Remove-Item -Recurse, and brace/variable/command-substitution targets.",
      "evidence": [
        {
          "test": "tests/test_policy_hardening.py"
        },
        {
          "receipt": "security_review"
        }
      ]
    },
    {
      "id": "AC-003",
      "statement": "Secret reads are blocked under quoting, ANSI-C and brace expansion, through recursive readers of directories holding secrets, and for credential stores (~/.git-credentials, ~/.netrc, ~/.config/gh/hosts.yml, id_ecdsa, .npmrc, .kube/config, …); Grep and NotebookRead count as reads.",
      "evidence": [
        {
          "test": "tests/test_policy_hardening.py"
        },
        {
          "receipt": "security_review"
        }
      ]
    },
    {
      "id": "AC-004",
      "statement": "Legitimate commands whose text merely mentions secret-like words (commit messages, grep/jq/awk/sed programs, git log --grep) stay allowed.",
      "evidence": [
        {
          "test": "tests/test_policy_hardening.py"
        },
        {
          "receipt": "security_review"
        }
      ]
    },
    {
      "id": "AC-005",
      "statement": "Direct external writes via gh write subcommands and curl/wget mutations (non-GET method, body, form, upload) require an exact delegated grant; dynamic selectors are treated as ambiguous.",
      "evidence": [
        {
          "test": "tests/test_policy_hardening.py"
        },
        {
          "receipt": "security_review"
        }
      ]
    },
    {
      "id": "AC-006",
      "statement": "Secret-read analysis is bounded by entry count and wall-clock time and fails closed (deny) when the budget is exhausted, so a hostile glob cannot hang or fail-open the hook.",
      "evidence": [
        {
          "test": "tests/test_policy_hardening.py"
        },
        {
          "receipt": "security_review"
        }
      ]
    }
  ],
