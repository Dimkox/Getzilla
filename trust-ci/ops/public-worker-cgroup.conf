# Install as a drop-in for the existing dedicated producer-control/worker unit.
# Requires systemd254+ and cgroupv2. This file does not create/start a service.
# The configured cgroup_root must be this unit's actual delegated parent, or a
# bind mount of it at /sys/fs/cgroup/getzilla-public in the protected containers.
# Keep the supervisor in its own leaf; the delegated parent must be empty.
[Service]
Delegate=pids
DelegateSubgroup=supervisor
KillMode=control-group
