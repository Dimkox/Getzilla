[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trust-ci"
version = "2.1.0"
description = "Independent exact-SHA CI trust boundary for Getzilla"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.142.4",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
adaptive-trust-ci = "adaptive_trust_ci.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_trust_ci = ["resources/*.sql"]

# Existing build and runner tools are part of the frozen installation graph.
[dependency-groups]
build = ["setuptools==84.0.0"]
runner = [
  "coverage==7.15.4", "pytest==9.1.1", "pytest-xdist==3.8.0", "pytest-cov==7.1.0",
  "ruff==0.16.2", "bandit==1.9.4", "tomli==2.4.1",
]

[tool.uv]
default-groups = []
required-version = "==0.11.12"
constraint-dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.1",
  "bandit==1.9.4",
  "certifi==2026.7.22",
