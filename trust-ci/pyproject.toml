[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trust-ci"
version = "2.1.0"
description = "Independent exact-SHA CI trust boundary for Getzilla"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography==50.0.2",
  "fastapi==0.142.4",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
adaptive-trust-ci = "adaptive_trust_ci.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_trust_ci = ["resources/*.sql"]

# Existing build and runner tools are part of the frozen installation graph.
[dependency-groups]
build = ["setuptools==84.1.0"]
runner = [
  "cvss==3.6",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  "pytest-cov==7.1.0",
  "coverage[toml]==7.15.4",
  "jsonschema==4.26.0",
  "attrs==26.1.0",
  "colorama==0.4.6; sys_platform == \"win32\"",
  "exceptiongroup==1.3.1; python_version < \"3.11\"",
  "execnet==2.1.2",
  "iniconfig==2.3.1",
  "jsonschema-specifications==2025.9.1",
  "packaging==26.3",
  "pluggy==1.7.0",
  "pygments==2.21.0",
  "referencing==0.37.0",
  "rpds-py==2026.9.1; python_version >= \"3.11\"",
  "rpds-py==0.30.0; python_version < \"3.11\"",
  "tomli==2.5.0; python_version < \"3.11\" or python_full_version <= \"3.11.0a6\"",
  "typing-extensions==4.16.0; python_version < \"3.13\"",
  "ruff==0.16.3",
  "bandit==1.9.4",
  "colorama==0.4.6; platform_system == \"Windows\"",
  "markdown-it-py==4.3.0",
  "mdurl==0.1.2",
  "PyYAML==6.0.3",
  "rich==15.0.0",
  "stevedore==5.10.0; python_version >= \"3.11\"",
  "stevedore==5.8.0; python_version < \"3.11\""
]

