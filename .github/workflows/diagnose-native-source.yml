name: Diagnose native Git evidence for 449
on:
  push:
    branches: [diagnostics/449-native-source]
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15-intel
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Show underlying native source error for a synthetic local repository
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONPATH: .getzilla:.
        run: |
          awk '/^[[:alnum:]]/ {selected=($0 ~ /^pyyaml==/)} selected' trust-ci/requirements-runner.txt > "$RUNNER_TEMP/yaml.txt"
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/yaml.txt"
          python - <<'PYTEST'
          import unittest, traceback
          from getzilla import verification_failure_excerpt as diag
          def details(e):
              print('Unqualified test IDs:', e.get('unqualified_skips'))
              print('Synthetic problems:', str(e.get('problems'))[:4800])
              return 'archived integration failed'
          diag.factory_assertion_message = details
          class Result(unittest.TextTestResult):
              def addError(self,t,err):
                  exc=err[1]
                  while exc is not None:
                      traceback.print_exception(type(exc),exc,exc.__traceback__,chain=False)
                      exc=exc.__context__
                  super().addError(t,err)
          names=['tests.test_installer.InstallerTests.test_archived_engine_verifier_runs_complete_installed_factory_inventory',
                 'tests.test_jira_worker_bootstrap', 'tests.test_retrieval_trace.RetrievalTraceTests.test_repeated_query_has_distinct_attempt_and_real_cache_hit',
                 'tests.test_public_review_witness.PublicReviewWitnessTests.test_owned_review_source_cut_checks_report_custody_before_use']
          result=unittest.TextTestRunner(resultclass=Result,verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(names))
          raise SystemExit(not result.wasSuccessful())
          PYTEST
