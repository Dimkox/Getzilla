name: Diagnose native Git evidence for 449
on:
  push:
    branches: [diagnostics/449-native-source]
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15-intel
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Show underlying native source error for a synthetic local repository
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONPATH: .getzilla:.
        run: |
          awk '/^[[:alnum:]]/ {selected=($0 ~ /^pyyaml==/)} selected' trust-ci/requirements-runner.txt > "$RUNNER_TEMP/yaml.txt"
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/yaml.txt"
          python -m unittest -v tests.test_retrieval_trace tests.test_research_use_conditions tests.test_public_review_witness
