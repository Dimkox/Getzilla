name: Diagnose native Git evidence for 449
on:
  push:
    branches: [diagnostics/449-native-source]
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15-intel
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Show underlying native source error for a synthetic local repository
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONPATH: .getzilla:.
        run: |
          awk '/^[[:alnum:]]/ {selected=($0 ~ /^pyyaml==/)} selected' trust-ci/requirements-runner.txt > "$RUNNER_TEMP/yaml.txt"
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/yaml.txt"
          python - <<'PYTEST'
          import time, unittest
          from collections import defaultdict
          from getzilla.retrieval import public_review_witness as w
          from getzilla import native_access
          from getzilla.retrieval import research
          times=defaultdict(list)
          def wrap(obj,name):
              fn=getattr(obj,name)
              def measured(*args,**kwargs):
                  started=time.monotonic()
                  try: return fn(*args,**kwargs)
                  finally: times[obj.__name__+'.'+name].append(time.monotonic()-started)
              setattr(obj,name,measured)
          for name in ('current','recheck'): wrap(w._Capture,name)
          for name in ('_exact_head','tree_fingerprint','context_binding','admit_module','get_receipt'): wrap(w,name)
          for name in ('_stamp','_unchanged'): wrap(native_access.NativeAccessBroker,name)
          wrap(research._PublicHost,'check_current')
          wrap(w._WitnessSourceFence,'check_current')
          test='tests.test_public_review_witness.PublicReviewWitnessTests.test_owned_review_source_cut_checks_report_custody_before_use'
          result=unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromName(test))
          for name,values in times.items(): print(name,len(values),round(sum(values),3),round(max(values),3))
          raise SystemExit(not result.wasSuccessful())
          PYTEST
