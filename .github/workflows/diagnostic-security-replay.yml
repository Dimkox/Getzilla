name: Diagnostic security replay (UNVERIFIED)
on:
  push:
    branches: [diagnostics/security-expanded-replay]
permissions:
  contents: read
jobs:
  replay-unverified:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out candidate source as scan data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the selected checker separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Dimkox/Getzilla
          ref: ${{ github.sha }}
          path: trusted-checker
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record fresh security job capacity before heavy work
        id: security_startup
        working-directory: trusted-checker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -I -B scripts/getzilla_startup_cpu.py --no-probe --json > "$RUNNER_TEMP/security-startup.json"
          python -I -B - "$RUNNER_TEMP/security-startup.json" <<'PYCPU'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd() / '.getzilla'))
          from getzilla.startup_cpu import parse_cpu_list, format_cpu_list
          try:
              from getzilla.security_image_job import _memory_admission
          except ImportError:
              raise SystemExit('BLOCKED: operator must select an exact reviewed checker/producer SHA with CI memory admission; candidate HEAD is never selected automatically')
          memory = _memory_admission(pathlib.Path('/sys/fs/cgroup/system.slice'))
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'security-memory.json').write_text(json.dumps(memory, sort_keys=True))
          record = json.loads(pathlib.Path(sys.argv[1]).read_text())
          capacity = record['chosen_capacity']
          if type(capacity) is not int or capacity <= 0:
              raise SystemExit('BLOCKED: fresh startup capacity is unavailable')
          cpus = set(sorted(parse_cpu_list(record['verified_cpus']) & set(os.sched_getaffinity(0)))[:min(6, capacity)])
          if not cpus:
              raise SystemExit('BLOCKED: no verified security job CPUs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('cpus=' + format_cpu_list(cpus) + '\n')
          PYCPU
      - name: Verify checker identity and install trusted quality tools
        shell: bash
        env:
          CHECKER_REF: ${{ github.sha }}
          SECURITY_CPUS: ${{ steps.security_startup.outputs.cpus }}
        run: |
          set -euo pipefail
          test "$(git -C trusted-checker rev-parse HEAD)" = "$CHECKER_REF"
          test -f trusted-checker/scripts/getzilla_security.py || { echo 'BLOCKED: reviewed checker bootstrap is incomplete'; exit 1; }
          taskset -c "$SECURITY_CPUS" python -I -m pip install --disable-pip-version-check -r trusted-checker/.getzilla/config/python-quality-requirements.txt
      - name: Run all expanded checks with trusted tools and fresh security data
        timeout-minutes: 30
        shell: bash
        env:
          SELECTED_SOURCE_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
          GETZILLA_EVENT_SHA: ${{ github.sha }}
          SECURITY_CPUS: ${{ steps.security_startup.outputs.cpus }}
        run: |
          export GITHUB_SHA="$SELECTED_SOURCE_SHA"
          test -f trusted-checker/.getzilla/getzilla/security_image_provision.py || { echo 'BLOCKED: operator must accept an exact reviewed checker/producer SHA and configure GETZILLA_SECURITY_CHECKER_SHA; candidate HEAD is never selected automatically'; exit 1; }
          selected_python="$(command -v python)"
          taskset -c "$SECURITY_CPUS" "$selected_python" -I -S -B -c 'import sys;sys.path.insert(0,sys.argv[1]);from getzilla.security_image_provision import provision;provision(sys.argv[2])' "$GITHUB_WORKSPACE/trusted-checker/.getzilla" "$RUNNER_TEMP/security-buildkit"
          sudo -n /usr/bin/env GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" "$selected_python" -I -S -B -c 'import sys,sysconfig;sys.path.insert(0,sys.argv.pop(1));sys.path.extend(sorted(set(sysconfig.get_paths()[k] for k in ("purelib","platlib"))));from getzilla.security_cli import main;raise SystemExit(main())' "$GITHUB_WORKSPACE/trusted-checker/.getzilla" --root "$GITHUB_WORKSPACE/candidate" --database "$RUNNER_TEMP/security-data" --artifacts "$RUNNER_TEMP/security-artifacts" --tools "$RUNNER_TEMP/security-tools" --produce-images --ci-image-corpus --backend-tool-pins "$RUNNER_TEMP/security-buildkit/toolchain.json" --input-profile "$RUNNER_TEMP/security-input-profile.json" --json-out "$RUNNER_TEMP/security-expanded.json"
      - name: Label diagnostic result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/replay-result"
          echo UNVERIFIED > "$RUNNER_TEMP/replay-result/QUALIFICATION"
          if test -f "$RUNNER_TEMP/package-refusal.json"; then
            cp "$RUNNER_TEMP/package-refusal.json" "$RUNNER_TEMP/replay-result/"
          fi
          if test -f "$RUNNER_TEMP/security-dind-cli.json"; then
            cp "$RUNNER_TEMP/security-dind-cli.json" "$RUNNER_TEMP/replay-result/"
          fi
          if test -f "$RUNNER_TEMP/security-expanded.json"; then
            cp "$RUNNER_TEMP/security-expanded.json" "$RUNNER_TEMP/replay-result/"
          fi
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unverified-security-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/replay-result
          retention-days: 3
