# Getzilla's own CI/merge gate.
#
# The gate follows repository visibility (owner decision 2026-10-06): a public
# repository is gated by GitHub Actions, a private repository by the
# self-hosted Trust CI GitHub App (adaptive-trust-ci, code in trust-ci/).
# Getzilla is public, so this workflow is its gate. Consumer repositories get
# their own workflow from `python3 scripts/getzilla_ci.py --write`. The
# windows job runs the native Windows port: doctor, the ported test modules
# and a smoke of the hooks and CLIs. The informational module-by-module core
# suite on Windows runs nightly in windows-full-suite.yml, not on PRs.
# The macos job runs the real installer from this commit (non-interactive,
# no coding agent), smokes the hooks and CLIs in the project it creates, and
# runs the core suite on macOS.
name: getzilla

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# A new push to a pull request cancels the outdated run of the same pull request. Every push and tag
# run gets its own group (its run id), so it never waits for, or is cancelled by, another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  GETZILLA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  GETZILLA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  platform-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - name: Check out the exact candidate and stable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13 for matrix validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Select the declared Linux native pairs
        id: inventory
        shell: bash
        run: |
          matrix=$(python scripts/getzilla_platform_install.py --matrix --profile linux)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  platform-install:
    name: Linux native installer (${{ matrix.id }})
    needs: platform-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GETZILLA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GETZILLA_PLATFORM_CELL: ${{ matrix.id }}
    steps:
      - name: Keep installer bytes as committed
        shell: bash
        run: git config --global core.autocrlf false
      - name: Check out the exact candidate and previous stable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up native Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
      - name: Provide native Git HTTPS build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libexpat1-dev libssl-dev zlib1g-dev
      - name: Exercise the real user installer and previous-stable project upgrade
        env:
          GETZILLA_GITHUB_METADATA_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          cell = os.environ['GETZILLA_PLATFORM_CELL']
          workspace = pathlib.Path(os.environ['RUNNER_TEMP']) / ('platform-' + cell)
          sys.exit(subprocess.call([sys.executable, 'scripts/getzilla_platform_install.py',
              '--cell', cell, '--workspace', str(workspace), '--head', os.environ['GETZILLA_EXPECTED_HEAD']]))
      - name: Observe canonical public fixture startup on macOS
        if: ${{ always() && matrix.os == 'macos' }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          workspace = pathlib.Path(os.environ['RUNNER_TEMP']) / ('public-fixture-startup-' + os.environ['GETZILLA_PLATFORM_CELL'])
          workspace.mkdir(mode=0o700)
          target = 'tests.test_public_fixture_startup.PublicFixtureStartupTests.test_canonical_startup_is_observed_before_environment_clear'
          bootstrap = (
              "import pathlib,sys,unittest\n"
              "root=pathlib.Path(sys.argv[1]).resolve()\n"
              "sys.path[:0]=[str(root),str(root/'.getzilla'),str(root/'factory/src')]\n"
              "suite=unittest.defaultTestLoader.loadTestsFromName(sys.argv[2])\n"
              "result=unittest.TextTestRunner(verbosity=2).run(suite)\n"
              "raise SystemExit(0 if result.wasSuccessful() and result.testsRun==1 and not result.skipped else 1)\n"
          )
          with (workspace / 'public-fixture-startup.log').open('wb') as log:
              try:
                  result = subprocess.run([sys.executable, '-I', '-S', '-B', '-c', bootstrap,
                      str(pathlib.Path.cwd()), target], stdout=log, stderr=subprocess.STDOUT,
                      env={'TMPDIR': str(workspace)}, timeout=15)
              except subprocess.TimeoutExpired:
                  log.write(b'public-fixture-startup timed out\n')
                  sys.exit(1)
          sys.exit(result.returncode)
      - name: Retain actual install and upgrade observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-platform-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/platform-${{ matrix.id }}/result.json
            ${{ runner.temp }}/platform-${{ matrix.id }}/*.log
          retention-days: 30
          if-no-files-found: error

      - name: Retain canonical public fixture startup observations
        if: ${{ always() && matrix.os == 'macos' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-public-fixture-startup-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-fixture-startup-${{ matrix.id }}/public-fixture-startup.log
          retention-days: 30
          if-no-files-found: error

  platform-install-results:
    name: Linux native install and upgrade observations
    if: always()
    needs: [platform-plan, platform-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate for observation validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13 for observation validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download only this run and attempt's Linux platform observations
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: getzilla-platform-linux-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-results
      - name: Require complete Linux native install and upgrade observations
        env:
          GETZILLA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GETZILLA_PLATFORM_JOB_RESULT: ${{ needs.platform-install.result }}
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          results = pathlib.Path(os.environ['RUNNER_TEMP']) / 'platform-results'
          sys.exit(subprocess.call([sys.executable, 'scripts/getzilla_platform_install.py',
              '--aggregate', str(results), '--profile', 'linux', '--head', os.environ['GETZILLA_EXPECTED_HEAD'],
              '--job-result', os.environ['GETZILLA_PLATFORM_JOB_RESULT']]))

  linux-core:
    if: always()
    needs: platform-install-results
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require both declared Linux native installer cells
        shell: bash
        env:
          GETZILLA_PLATFORM_RESULT: ${{ needs.platform-install-results.result }}
        run: test "$GETZILLA_PLATFORM_RESULT" = success
      - name: Check out the exact commit with full history
        id: source_checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record startup capacity
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        run: python scripts/getzilla_startup_cpu.py --no-probe
      - name: Set up the fixed Linux Node dependency
        id: node_setup
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          architecture: x64
          package-manager-cache: false
      - name: Admit physical Node inside the read-only runtime root
        id: node_runtime
        if: (success() || failure()) && steps.source_checkout.outcome == 'success' && steps.node_setup.outcome == 'success'
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, stat, subprocess
          expected = pathlib.Path(os.environ['RUNNER_TOOL_CACHE']).resolve(strict=True) / 'node' / '24.22.2' / 'x64' / 'bin' / 'node'
          selected = pathlib.Path(shutil.which('node') or '').resolve(strict=True)
          if selected != expected or not selected.is_file():
              raise SystemExit('selected Node is outside its declared cache entry')
          if subprocess.check_output([str(selected), '--version'], text=True).strip() != 'v24.22.2':
              raise SystemExit('selected Node version differs')
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          selected_digest = digest(selected)
          subprocess.run(['sudo', 'install', '-T', '-m', '0755', '--', str(selected), '/usr/bin/node'], check=True)
          node = pathlib.Path('/usr/bin/node')
          info = node.lstat()
          if (node.is_symlink() or not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o755
                  or node.resolve(strict=True) != node or digest(node) != selected_digest):
              raise SystemExit('physical Node identity differs')
          if subprocess.check_output(['/usr/bin/node', '--version'], text=True).strip() != 'v24.22.2':
              raise SystemExit('physical Node version differs')
          print(json.dumps({'node_version': '24.22.2', 'sha256': selected_digest, 'physical_runtime_admitted': True}))
      - name: Admit Bubblewrap for required Linux sandbox tests
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Admit namespaces only for the distro-owned sandbox executable.
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          /usr/bin/bwrap --version
          /usr/bin/bwrap --unshare-all --die-with-parent --ro-bind / / -- /usr/bin/true
      - name: Admit protected syntax frontends
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends python3.12 php8.3-cli
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, '.getzilla')
          from getzilla.security_acquisition import provision_typescript
          parser = provision_typescript(pathlib.Path(os.environ['RUNNER_TEMP']) / 'typescript-parser')
          subprocess.run(['sudo', 'install', '-d', '-m', '0755', '/usr/share/getzilla'], check=True)
          subprocess.run(['sudo', 'install', '-T', '-m', '0644', str(parser), '/usr/share/getzilla/typescript-5.9.3.js'], check=True)
          PY
          python - <<'PY'
          import pathlib, sys, tempfile
          sys.path.insert(0, '.getzilla')
          from getzilla.security_opengrep import syntax_check, syntax_frontend
          for language in ('python', 'php', 'javascript', 'typescript'):
              with syntax_frontend(language) as frontend:
                  print(language, frontend.grammar, frontend.digest)
                  if language == 'typescript':
                      with tempfile.TemporaryDirectory() as directory:
                          syntax_check(frontend, b'export const value: number = 1; throw new Error("must not execute");', pathlib.Path(directory))
          PY
      - name: Install test requirements
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          python trust-ci/lock_profiles.py --check
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r trust-ci/requirements-runner.txt
          cp -R trust-ci "$RUNNER_TEMP/trust-ci-source"
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$RUNNER_TEMP/trust-ci-source"
      - name: Set up pinned uv
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Full Factory unit discovery without database authority
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        timeout-minutes: 15
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/factory-unit-venv
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail
          uv --version
          uv run --locked --project factory python .getzilla/getzilla/factory_tests.py --root "$PWD" --report "$RUNNER_TEMP/factory-unit.json" 2>&1 | tee "$RUNNER_TEMP/factory-unit.log"
      - name: Require the real Linux CJS ESM and read-only sandbox profile
        id: node_profile_admission
        if: success() && steps.source_checkout.outcome == 'success' && steps.node_runtime.outcome == 'success'
        run: python -m unittest tests.test_skill_sandbox.BmadDependencyGraft.test_synthetic_cjs_esm_load_and_all_input_mounts_are_read_only
      - name: Scan changed source files for secrets
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, ".getzilla")
          from getzilla.security_tools import native_secret_observations
          base = os.environ["GETZILLA_BASE_SHA"]
          head = os.environ["GETZILLA_EXPECTED_HEAD"]
          command = ["git", "ls-files", "-z"] if base == "0" * 40 else [
              "git", "diff", "--name-only", "-z", "--diff-filter=ACMRT", f"{base}...{head}", "--"]
          paths = [os.fsdecode(p) for p in subprocess.check_output(command).split(b"\0") if p]
          result = native_secret_observations(Path.cwd(), paths)
          print(result["summary"])
          sys.exit(result["outcome"] != "pass")
      - name: Known vulnerabilities in pinned dependencies (OSV)
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        run: python scripts/getzilla_vulns.py --online --db "$RUNNER_TEMP/getzilla-osv"
      - name: Static checks as the verifier runs them
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          paths=$(python -c "import sys; sys.path.insert(0, '.getzilla'); from pathlib import Path; from getzilla.verification import QUALITY_PY_PATHS; print(' '.join(p for p in QUALITY_PY_PATHS if Path(p).exists()))")
          ruff check --output-format github $paths
          bandit -c bandit.yaml -q -r $(printf '%s\n' $paths | grep -v '^tests') -f custom --msg-template '::error file={relpath},line={line}::{test_id} {msg}'
      - name: Acquire the digest-pinned OpenGrep engine
        id: opengrep_download
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG OPENGREP_VERSION=//p' trust-ci/runner.Dockerfile)
          digest=$(sed -n 's/^ARG OPENGREP_SHA256=//p' trust-ci/runner.Dockerfile)
          mkdir -p "$RUNNER_TEMP/opengrep"
          curl -fsSL -o "$RUNNER_TEMP/opengrep/opengrep" "https://github.com/opengrep/opengrep/releases/download/v${version}/opengrep_manylinux_x86"
          echo "${digest}  $RUNNER_TEMP/opengrep/opengrep" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/opengrep/opengrep"
      - name: OpenGrep taint rules (the Trust CI engine)
        if: (success() || failure()) && steps.source_checkout.outcome == 'success' && steps.opengrep_download.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/opengrep:$PATH"
          python -m unittest tests.test_opengrep
          python -c "import sys; sys.path.insert(0, '.getzilla'); from pathlib import Path; from getzilla.verification import _opengrep; r = _opengrep(Path('.')); print(r.status, r.summary); [print(d) for d in r.details]; sys.exit(r.status != 'pass')"
      - name: Trust CI tests
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s trust-ci/tests 2>&1 | tee "$RUNNER_TEMP/trust-ci-tests.log"
      - name: Annotate failing tests
        if: failure() && steps.source_checkout.outcome == 'success'
        shell: python
        run: |
          import os
          import pathlib
          import re

          for log in ("trust-ci-tests.log",):
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / log
              if not path.is_file():
                  continue
              blocks = re.split(r"^={50,}$", path.read_text(encoding="utf-8", errors="replace"), flags=re.MULTILINE)
              for block in blocks[1:41]:
                  lines = [line for line in block.strip().splitlines() if line.strip()]
                  if not lines:
                      continue
                  title = lines[0][:200]
                  detail = " | ".join(line.strip() for line in lines[-25:])[:6000]
                  print(f"::error title={log}::{title} -- {detail}".replace("\n", " "))
      - name: Export CI evidence
        id: export_evidence
        if: always() && steps.source_checkout.outcome == 'success'
        run: python scripts/getzilla_ci_evidence.py --output "${{ runner.temp }}/getzilla-evidence" --job linux-core --status "${{ job.status }}"
      - name: Retain CI evidence for 30 days
        if: always() && steps.export_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-linux-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/getzilla-evidence/
          retention-days: 30
          if-no-files-found: error

  # Core tests run in parallel shards on separate hosted runners, without waiting for the installer
  # cells. linux-core keeps the installer gate, Factory unit discovery, OSV, static checks, OpenGrep,
  # Trust CI tests and the evidence; the linux admission requires both jobs.
  linux-core-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact commit with full history
        id: source_checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record startup capacity
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        run: python scripts/getzilla_startup_cpu.py --no-probe
      - name: Set up the fixed Linux Node dependency
        id: node_setup
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          architecture: x64
          package-manager-cache: false
      - name: Admit physical Node inside the read-only runtime root
        id: node_runtime
        if: (success() || failure()) && steps.source_checkout.outcome == 'success' && steps.node_setup.outcome == 'success'
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil, stat, subprocess
          expected = pathlib.Path(os.environ['RUNNER_TOOL_CACHE']).resolve(strict=True) / 'node' / '24.22.2' / 'x64' / 'bin' / 'node'
          selected = pathlib.Path(shutil.which('node') or '').resolve(strict=True)
          if selected != expected or not selected.is_file():
              raise SystemExit('selected Node is outside its declared cache entry')
          if subprocess.check_output([str(selected), '--version'], text=True).strip() != 'v24.22.2':
              raise SystemExit('selected Node version differs')
          def digest(path):
              with path.open('rb') as stream:
                  return hashlib.file_digest(stream, 'sha256').hexdigest()
          selected_digest = digest(selected)
          subprocess.run(['sudo', 'install', '-T', '-m', '0755', '--', str(selected), '/usr/bin/node'], check=True)
          node = pathlib.Path('/usr/bin/node')
          info = node.lstat()
          if (node.is_symlink() or not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o755
                  or node.resolve(strict=True) != node or digest(node) != selected_digest):
              raise SystemExit('physical Node identity differs')
          if subprocess.check_output(['/usr/bin/node', '--version'], text=True).strip() != 'v24.22.2':
              raise SystemExit('physical Node version differs')
          print(json.dumps({'node_version': '24.22.2', 'sha256': selected_digest, 'physical_runtime_admitted': True}))
      - name: Admit Bubblewrap for required Linux sandbox tests
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # Admit namespaces only for the distro-owned sandbox executable.
          sudo tee /etc/apparmor.d/bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          /usr/bin/bwrap --version
          /usr/bin/bwrap --unshare-all --die-with-parent --ro-bind / / -- /usr/bin/true
      - name: Admit protected syntax frontends
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends python3.12 php8.3-cli
          python - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, '.getzilla')
          from getzilla.security_acquisition import provision_typescript
          parser = provision_typescript(pathlib.Path(os.environ['RUNNER_TEMP']) / 'typescript-parser')
          subprocess.run(['sudo', 'install', '-d', '-m', '0755', '/usr/share/getzilla'], check=True)
          subprocess.run(['sudo', 'install', '-T', '-m', '0644', str(parser), '/usr/share/getzilla/typescript-5.9.3.js'], check=True)
          PY
          python - <<'PY'
          import pathlib, sys, tempfile
          sys.path.insert(0, '.getzilla')
          from getzilla.security_opengrep import syntax_check, syntax_frontend
          for language in ('python', 'php', 'javascript', 'typescript'):
              with syntax_frontend(language) as frontend:
                  print(language, frontend.grammar, frontend.digest)
                  if language == 'typescript':
                      with tempfile.TemporaryDirectory() as directory:
                          syntax_check(frontend, b'export const value: number = 1; throw new Error("must not execute");', pathlib.Path(directory))
          PY
      - name: Install test requirements
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        shell: bash
        run: |
          python trust-ci/lock_profiles.py --check
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r trust-ci/requirements-runner.txt
          cp -R trust-ci "$RUNNER_TEMP/trust-ci-source"
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$RUNNER_TEMP/trust-ci-source"
      - name: Set up pinned uv
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Require the real Linux CJS ESM and read-only sandbox profile
        id: node_profile_admission
        if: success() && steps.source_checkout.outcome == 'success' && steps.node_runtime.outcome == 'success'
        run: python -m unittest tests.test_skill_sandbox.BmadDependencyGraft.test_synthetic_cjs_esm_load_and_all_input_mounts_are_read_only
      - name: Core tests
        if: (success() || failure()) && steps.source_checkout.outcome == 'success' && steps.node_profile_admission.outcome == 'success'
        shell: bash
        env:
          # The hosted runner is dedicated to this job: use every measured CPU, not the workstation n-2 reserve.
          GETZILLA_TEST_CPU_RESERVE: "0"
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import sys
          sys.path.insert(0, 'scripts')
          import getzilla_cli as cli
          subprocess.run([cli.project_python(cli.HOME), '-c', 'import pytest, xdist'], check=True)
          PY
          python - > "$RUNNER_TEMP/core-shard-files.txt" <<'SHARD'
          import json
          import os
          import pathlib
          import statistics

          # Same balancing as macos-core: measured seconds per module, longest first onto the least-loaded shard.
          modules = sorted(pathlib.Path("tests").rglob("test*.py"))
          count = int(os.environ["SHARD_COUNT"])
          seconds = json.loads(pathlib.Path(".github/ci/macos-test-seconds.json").read_text(encoding="utf-8"))["seconds"]
          default = statistics.median(seconds.values())
          weight = {path: seconds.get(path.as_posix(), default) for path in modules}
          loads = [0.0] * count
          assigned = [[] for _ in range(count)]
          for path in sorted(modules, key=lambda item: (-weight[item], item.as_posix())):
              shard = min(range(count), key=lambda index: (loads[index], index))
              loads[shard] += weight[path]
              assigned[shard].append(path)
          for path in sorted(assigned[int(os.environ["SHARD_INDEX"])]):
              print(path.as_posix())
          SHARD
          selected=()
          while IFS= read -r module; do selected+=("$module"); done < "$RUNNER_TEMP/core-shard-files.txt"
          test "${#selected[@]}" -gt 0
          echo "shard ${SHARD_INDEX}/${SHARD_COUNT}: ${#selected[@]} modules"
          python scripts/getzilla_cli.py test --require-parallel "${selected[@]}" --max-worker-restart=0 --durations=20 -ra 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Require core tests to leave the exact checkout clean
        if: (success() || failure()) && steps.source_checkout.outcome == 'success'
        env:
          GETZILLA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GETZILLA_EXPECTED_HEAD"
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            printf '%s\n' "$dirty"
            echo '::error title=core-tests::core tests changed the checkout'
            exit 1
          fi
      - name: Retain core test log for 30 days
        if: always() && steps.source_checkout.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-core-tests-log-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-tests.log
          retention-days: 30
          if-no-files-found: ignore
      - name: Annotate failing core tests
        if: failure() && steps.source_checkout.outcome == 'success'
        shell: python
        run: |
          import os
          import pathlib
          import re

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "core-tests.log"
          if path.is_file():
              blocks = re.split(r"^={50,}$", path.read_text(encoding="utf-8", errors="replace"), flags=re.MULTILINE)
              for block in blocks[1:41]:
                  lines = [line for line in block.strip().splitlines() if line.strip()]
                  if lines:
                      detail = " | ".join(line.strip() for line in lines[-25:])[:6000]
                      print(f"::error title=core-tests::{lines[0][:200]} -- {detail}".replace("\n", " "))

  live-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: factory
            job_timeout: 40
            main_timeout: 1500
          - cell: trust-ci
            job_timeout: 30
            main_timeout: 1200
          - cell: lifecycle
            job_timeout: 25
            main_timeout: 900
    steps:
      - name: Reserve cleanup and evidence time before any allocation
        shell: python
        env:
          JOB_MINUTES: ${{ matrix.job_timeout }}
        run: |
          import os, time
          deadline = int(time.time()) + int(os.environ['JOB_MINUTES']) * 60 - 300
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('GETZILLA_LIVE_DEADLINE=' + str(deadline) + '\n')
      - name: Check out the exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Prepare hash-locked offline Trust inputs for the pinned cp313 Linux image
        if: matrix.cell == 'trust-ci'
        shell: bash
        run: |
          python scripts/getzilla_live_inputs.py --wheelhouse "$RUNNER_TEMP/trust-live-wheelhouse"
          echo "GETZILLA_LIVE_WHEELHOUSE=$RUNNER_TEMP/trust-live-wheelhouse" >> "$GITHUB_ENV"
      - name: Record capacity and load immutable component images
        shell: bash
        run: |
          set -euo pipefail
          python scripts/getzilla_startup_cpu.py --no-probe
          python - <<'PYTHON'
          import json, pathlib, subprocess, sys
          sys.path.insert(0, '.getzilla')
          from getzilla.disposable_resources import ensure_images
          ensure_images(pathlib.Path('.'))
          PYTHON
      - name: Run bounded isolated acceptance with cleanup observer
        shell: bash
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: python scripts/getzilla_live.py --cell "${{ matrix.cell }}" --output "$RUNNER_TEMP/live-observations" --timeout-seconds "${{ matrix.main_timeout }}"
      - name: Export allowlisted live observations
        if: always()
        run: python scripts/getzilla_ci_evidence.py --live-source "${{ runner.temp }}/live-observations" --output "${{ runner.temp }}/live-evidence"
      - name: Retain live evidence for 30 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-live-${{ matrix.cell }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-evidence/
          retention-days: 30
          if-no-files-found: error

  security-expanded:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out candidate source as scan data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Select an exact checker from operator configuration or the base commit
        id: checker_ref
        shell: python
        env:
          OPERATOR_CHECKER: ${{ vars.GETZILLA_SECURITY_CHECKER_SHA }}
          BASE_CHECKER: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          import os, re
          override = os.environ['OPERATOR_CHECKER']
          ref = override or os.environ['BASE_CHECKER']
          if not re.fullmatch(r'[0-9a-f]{40}', ref) or ref == '0' * 40:
              raise SystemExit('BLOCKED: exact trusted checker ref is not configured')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + ref + '\n')
              stream.write('selection=' + ('operator-variable' if override else 'base-commit') + '\n')
      - name: Check out the selected checker separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Dimkox/Getzilla
          ref: ${{ steps.checker_ref.outputs.sha }}
          path: trusted-checker
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record fresh security job capacity before heavy work
        id: security_startup
        working-directory: trusted-checker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -I -B scripts/getzilla_startup_cpu.py --no-probe --json > "$RUNNER_TEMP/security-startup.json"
          python -I -B - "$RUNNER_TEMP/security-startup.json" <<'PYCPU'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path.cwd() / '.getzilla'))
          from getzilla.startup_cpu import parse_cpu_list, format_cpu_list
          try:
              from getzilla.security_image_job import _memory_admission
          except ImportError:
              raise SystemExit('BLOCKED: operator must select an exact reviewed checker/producer SHA with CI memory admission; candidate HEAD is never selected automatically')
          memory = _memory_admission(pathlib.Path('/sys/fs/cgroup/system.slice'))
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'security-memory.json').write_text(json.dumps(memory, sort_keys=True))
          record = json.loads(pathlib.Path(sys.argv[1]).read_text())
          capacity = record['chosen_capacity']
          if type(capacity) is not int or capacity <= 0:
              raise SystemExit('BLOCKED: fresh startup capacity is unavailable')
          cpus = set(sorted(parse_cpu_list(record['verified_cpus']) & set(os.sched_getaffinity(0)))[:min(6, capacity)])
          if not cpus:
              raise SystemExit('BLOCKED: no verified security job CPUs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('cpus=' + format_cpu_list(cpus) + '\n')
          PYCPU
      - name: Verify checker identity and install trusted quality tools
        shell: bash
        env:
          CHECKER_REF: ${{ steps.checker_ref.outputs.sha }}
          SECURITY_CPUS: ${{ steps.security_startup.outputs.cpus }}
        run: |
          set -euo pipefail
          test "$(git -C trusted-checker rev-parse HEAD)" = "$CHECKER_REF"
          test -f trusted-checker/scripts/getzilla_security.py || { echo 'BLOCKED: reviewed checker bootstrap is incomplete'; exit 1; }
          taskset -c "$SECURITY_CPUS" python -I -m pip install --disable-pip-version-check -r trusted-checker/.getzilla/config/python-quality-requirements.txt
      - name: Run all expanded checks with trusted tools and fresh security data
        timeout-minutes: 30
        shell: bash
        env:
          SELECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GETZILLA_EVENT_SHA: ${{ github.sha }}
          SECURITY_CPUS: ${{ steps.security_startup.outputs.cpus }}
        run: |
          export GITHUB_SHA="$SELECTED_SOURCE_SHA"
          python - <<'PYCONTEXT'
          import json, os, pathlib, runpy, subprocess
          api = runpy.run_path('candidate/.getzilla/getzilla/ci_security_context.py')
          actual = subprocess.check_output(['git', '-C', 'candidate', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != os.environ['SELECTED_SOURCE_SHA']:
              raise SystemExit('selected source identity differs')
          selected, provenance = api['selected_run_environment'](os.environ, actual)
          if selected['GITHUB_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('trusted CLI run head differs from selected source')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'security-event.json'
          path.write_text(json.dumps(provenance, sort_keys=True))
          PYCONTEXT
          test -f trusted-checker/.getzilla/getzilla/security_image_provision.py || { echo 'BLOCKED: operator must accept an exact reviewed checker/producer SHA and configure GETZILLA_SECURITY_CHECKER_SHA; candidate HEAD is never selected automatically'; exit 1; }
          selected_python="$(command -v python)"
          taskset -c "$SECURITY_CPUS" "$selected_python" -I -S -B -c 'import sys;sys.path.insert(0,sys.argv[1]);from getzilla.security_image_provision import provision;provision(sys.argv[2])' "$GITHUB_WORKSPACE/trusted-checker/.getzilla" "$RUNNER_TEMP/security-buildkit"
          sudo -n /usr/bin/env GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" "$selected_python" -I -S -B -c 'import sys,sysconfig;sys.path.insert(0,sys.argv.pop(1));sys.path.extend(sorted(set(sysconfig.get_paths()[k] for k in ("purelib","platlib"))));from getzilla.security_cli import main;raise SystemExit(main())' "$GITHUB_WORKSPACE/trusted-checker/.getzilla" --root "$GITHUB_WORKSPACE/candidate" --database "$RUNNER_TEMP/security-data" --artifacts "$RUNNER_TEMP/security-artifacts" --tools "$RUNNER_TEMP/security-tools" --produce-images --ci-image-corpus --backend-tool-pins "$RUNNER_TEMP/security-buildkit/toolchain.json" --input-profile "$RUNNER_TEMP/security-input-profile.json" --json-out "$RUNNER_TEMP/security-expanded.json"
      - name: Bind scanner observations to this workflow and source
        if: always()
        shell: bash
        env:
          CHECKER_REF: ${{ steps.checker_ref.outputs.sha }}
          CHECKER_SELECTION: ${{ steps.checker_ref.outputs.selection }}
        run: |
          python candidate/scripts/getzilla_ci_admission.py --security-envelope --root "$GITHUB_WORKSPACE/candidate" --checker "$GITHUB_WORKSPACE/trusted-checker" --checker-ref "$CHECKER_REF" --checker-selection "$CHECKER_SELECTION" --report "$RUNNER_TEMP/security-expanded.json" --output "$RUNNER_TEMP/security-evidence"
      - name: Retain expanded security evidence for 30 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-security-expanded-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-evidence/
          retention-days: 30
          if-no-files-found: error

  linux:
    needs: [linux-core, linux-core-tests, live-acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact source for evidence validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download only evidence from this run and attempt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: getzilla-{linux-core,live-*}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/required-evidence
      - name: Require all jobs and bound evidence before the existing linux check passes
        if: always()
        env:
          GETZILLA_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/getzilla_ci_admission.py --artifacts "${{ runner.temp }}/required-evidence"

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep checkout bytes and executable bits as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record startup capacity
        run: python scripts/getzilla_startup_cpu.py --no-probe
      - name: Doctor
        run: python scripts/getzilla_doctor.py
      - name: Windows-ported tests
        run: python -m unittest tests.test_fsx tests.test_install_scripts tests.test_workflow_sources tests.test_ci_gate tests.test_review_source tests.test_neutral_hooks tests.test_windows_snapshot_store tests.test_windows_hook_launchers tests.test_installer_cache_cleanup tests.test_installer_windows_current tests.test_installer_windows_nonadmin tests.test_managed_pyyaml tests.test_local_grants tests.test_workflow_baseline_fresh_install
      - name: Hooks and CLI smoke
        env:
          GETZILLA_SESSION_ID: ci
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          set -x
          workspace="$RUNNER_TEMP/smoke"
          git clone --quiet . "$workspace"
          cd "$workspace"
          git config user.name smoke
          git config user.email smoke@example.invalid
          prompt='{"prompt":"Add a health endpoint to the API","session_id":"ci","hook_event_name":"UserPromptSubmit"}'
          echo "$prompt" | python .getzilla/hooks/session_start.py
          echo "$prompt" | python .getzilla/hooks/user_prompt_submit.py
          echo '{"session_id":"ci","tool_name":"Bash","tool_input":{"command":"git push origin main"},"hook_event_name":"PreToolUse"}' \
            | python .getzilla/hooks/pre_tool_use.py | tee "$RUNNER_TEMP/pre.json"
          grep -q '"deny"' "$RUNNER_TEMP/pre.json"
          for hook in post_tool_use pre_compact stop_gate subagent_start subagent_stop session_end; do
            echo '{"session_id":"ci","hook_event_name":"Smoke"}' | python ".getzilla/hooks/$hook.py"
          done
          python scripts/getzilla_route.py --show
          python scripts/getzilla_change.py start --title "Health endpoint"
          python scripts/getzilla_status.py > /dev/null
          python scripts/getzilla_architecture.py validate
          python scripts/getzilla_architecture.py drift
          python scripts/getzilla_architecture.py diagram --check
          python scripts/getzilla_governance.py validate
          python scripts/generate_manifest.py
          python scripts/verify_manifest.py
          python scripts/getzilla_ci.py --plan --visibility public
          python scripts/install_into.py --plan "$RUNNER_TEMP/plan-target" > /dev/null
          python scripts/install_into.py --materialize-new "$RUNNER_TEMP/new-target" > /dev/null
          cd "$RUNNER_TEMP/new-target"
          python scripts/getzilla_doctor.py
      - name: Annotate smoke failure
        if: failure()
        shell: python
        run: |
          import os
          import pathlib

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "smoke.log"
          if path.is_file():
              lines = [line for line in path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
              print("::error title=windows-smoke::" + " | ".join(line.strip() for line in lines[-40:])[:8000])
      - name: Export CI evidence
        id: export_evidence
        if: always()
        run: python scripts/getzilla_ci_evidence.py --output "${{ runner.temp }}/getzilla-evidence" --job windows --status "${{ job.status }}"
      - name: Retain CI evidence for 30 days
        if: always() && steps.export_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/getzilla-evidence/
          retention-days: 30
          if-no-files-found: error

  macos-install:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Installer from this commit (non-interactive, no agent)
        env:
          GETZILLA_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/install.log") 2>&1
          git config user.name ci
          git config user.email ci@example.invalid
          git branch -f ci-macos-install HEAD
          GETZILLA_NONINTERACTIVE=1 GETZILLA_SKIP_AGENT=1 GETZILLA_EU_AI_ACT=0 \
            GETZILLA_REPO="file://$GITHUB_WORKSPACE" GETZILLA_REF=ci-macos-install \
            GETZILLA_HOME="$RUNNER_TEMP/getzilla-home" GETZILLA_NEW_PROJECT="$RUNNER_TEMP/new-project" \
            bash scripts/install.sh
          test "$(git -C "$RUNNER_TEMP/getzilla-home" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          "$HOME/.local/bin/getzilla" help > /dev/null
      - name: Hooks and CLI smoke in the installed project
        env:
          GETZILLA_SESSION_ID: ci
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          set -x
          cd "$RUNNER_TEMP/new-project"
          git init -q 2>/dev/null || true
          git config user.name smoke
          git config user.email smoke@example.invalid
          prompt='{"prompt":"Add a health endpoint to the API","session_id":"ci","hook_event_name":"UserPromptSubmit"}'
          echo "$prompt" | python3 .getzilla/hooks/session_start.py
          echo "$prompt" | python3 .getzilla/hooks/user_prompt_submit.py
          echo '{"session_id":"ci","tool_name":"Bash","tool_input":{"command":"git push origin main"},"hook_event_name":"PreToolUse"}' \
            | python3 .getzilla/hooks/pre_tool_use.py | tee "$RUNNER_TEMP/pre.json"
          grep -q '"deny"' "$RUNNER_TEMP/pre.json"
          for hook in post_tool_use pre_compact stop_gate subagent_start subagent_stop session_end; do
            echo '{"session_id":"ci","hook_event_name":"Smoke"}' | python3 ".getzilla/hooks/$hook.py"
          done
          python3 scripts/getzilla_doctor.py
          python3 scripts/getzilla_route.py --show
          python3 scripts/getzilla_status.py > /dev/null
      - name: Annotate macOS install failures
        if: failure()
        shell: python
        run: |
          import os
          import pathlib

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("install.log", "smoke.log"):
              path = temp / name
              if path.is_file():
                  lines = [line for line in path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
                  print(f"::error title=macos-{name}::" + " | ".join(line.strip() for line in lines[-40:])[:8000])

  macos-core:
    # GitHub runs at most 5 macOS jobs at once on the Free, Pro and Team plans
    # (docs.github.com/en/actions/reference/limits). Four shards plus macos-install fill that limit
    # in one wave; more shards only wait in the queue.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Keep the checkout Git identity used by earlier shard runs
        run: |
          git config user.name ci
          git config user.email ci@example.invalid
          git branch -f ci-macos-install HEAD
      - name: Record startup capacity
        run: python scripts/getzilla_startup_cpu.py --no-probe
      - name: Install test requirements
        if: success() || failure()
        run: |
          python trust-ci/lock_profiles.py --check
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r trust-ci/requirements-runner.txt
          cp -R trust-ci "$RUNNER_TEMP/trust-ci-source"
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation "$RUNNER_TEMP/trust-ci-source"
      - name: Core tests on macOS
        if: success() || failure()
        env:
          TMPDIR: ${{ runner.temp }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          python - <<'PYTEST' 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
          import os
          import pathlib
          import subprocess
          import sys

          import json
          import statistics

          modules = sorted(pathlib.Path("tests").rglob("test*.py"))
          count = int(os.environ["SHARD_COUNT"])
          # Balance shards by measured macOS seconds per module (longest first, least loaded shard).
          # A module without a measurement gets the median, so every module is still assigned once.
          seconds = json.loads(pathlib.Path(".github/ci/macos-test-seconds.json").read_text(encoding="utf-8"))["seconds"]
          default = statistics.median(seconds.values())
          weight = {path: seconds.get(path.as_posix(), default) for path in modules}
          loads = [0.0] * count
          assigned = [[] for _ in range(count)]
          for path in sorted(modules, key=lambda item: (-weight[item], item.as_posix())):
              shard = min(range(count), key=lambda index: (loads[index], index))
              loads[shard] += weight[path]
              assigned[shard].append(path)
          selected = sorted(assigned[int(os.environ["SHARD_INDEX"])])
          print(f"shard {os.environ['SHARD_INDEX']}/{count}: {len(selected)} modules, estimated {loads[int(os.environ['SHARD_INDEX'])] / 60:.1f} min", flush=True)
          if not selected:
              raise SystemExit("Empty macOS test shard")
          failed = []
          # Isolate each module while making the checkout package available to the test loader.
          launch = "import sys, unittest; sys.path.insert(0, '.getzilla'); unittest.main(module=None)"
          for path in selected:
              module = ".".join(path.with_suffix("").parts)
              result = subprocess.run([sys.executable, "-c", launch, "-v", module])
              if result.returncode:
                  failed.append(module)
          print(f"{len(selected)} modules executed. Failed modules: {failed}", flush=True)
          raise SystemExit(bool(failed))
          PYTEST
      - name: Annotate macOS failures
        if: failure()
        shell: python
        run: |
          import os
          import pathlib
          import re

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("install.log", "smoke.log"):
              path = temp / name
              if path.is_file():
                  lines = [line for line in path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
                  print(f"::error title=macos-{name}::" + " | ".join(line.strip() for line in lines[-40:])[:8000])
          path = temp / "core-tests.log"
          if path.is_file():
              text = path.read_text(encoding="utf-8", errors="replace")
              for block in re.split(r"\n(?==+\n(?:FAIL|ERROR): )", text)[1:60]:
                  lines = [line for line in block.splitlines() if line.strip() and not line.startswith("=")]
                  if lines:
                      print("::error title=macos-test::" + " | ".join(line.strip() for line in lines[:2] + lines[-12:])[:4000])
      - name: Export CI evidence
        id: export_evidence
        if: always()
        run: python scripts/getzilla_ci_evidence.py --output "${{ runner.temp }}/getzilla-evidence" --job macos --status "${{ job.status }}"
      - name: Retain CI evidence for 30 days
        if: always() && steps.export_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-macos-shard-${{ matrix.shard }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/getzilla-evidence/
          retention-days: 30
          if-no-files-found: error

  macos:
    needs: [macos-install, macos-core]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the native macOS installer and every native macOS test shard
        env:
          MACOS_INSTALL_RESULT: ${{ needs.macos-install.result }}
          MACOS_RESULT: ${{ needs.macos-core.result }}
        run: test "$MACOS_INSTALL_RESULT" = success && test "$MACOS_RESULT" = success
