# Getzilla's own CI/merge gate.
#
# The gate follows repository visibility (owner decision 2026-10-06): a public
# repository is gated by GitHub Actions, a private repository by the
# self-hosted Trust CI GitHub App (adaptive-trust-ci, code in trust-ci/).
# Getzilla is public, so this workflow is its gate. Consumer repositories get
# their own workflow from `python3 scripts/getzilla_ci.py --write`. The
# windows job runs the native Windows port: doctor, the ported test modules
# and a smoke of the hooks and CLIs. The informational module-by-module core
# suite on Windows runs nightly in windows-full-suite.yml, not on PRs.
# The macos job runs the real installer from this commit (non-interactive,
# no coding agent), smokes the hooks and CLIs in the project it creates, and
# runs the core suite on macOS.
name: getzilla

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  GETZILLA_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  GETZILLA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record startup capacity
        run: python scripts/getzilla_startup_cpu.py --no-probe
      - name: Install test requirements
        shell: bash
        run: |
          if [ -f .getzilla/config/python-test-requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r .getzilla/config/python-test-requirements.txt
          fi
          cp -R trust-ci "$RUNNER_TEMP/trust-ci-source"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/trust-ci-source[test]" ruff==0.16.3 bandit==1.9.4 tomli==2.4.1
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Full Factory unit discovery without database authority
        if: success() || failure()
        timeout-minutes: 15
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/factory-unit-venv
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          set -euo pipefail
          uv --version
          uv run --locked --project factory python .getzilla/getzilla/factory_tests.py --root "$PWD" --report "$RUNNER_TEMP/factory-unit.json" 2>&1 | tee "$RUNNER_TEMP/factory-unit.log"
      - name: Known vulnerabilities in pinned dependencies (OSV)
        run: python scripts/getzilla_vulns.py --online
      - name: Static checks as the verifier runs them
        shell: bash
        run: |
          paths=$(python -c "import sys; sys.path.insert(0, '.getzilla'); from pathlib import Path; from getzilla.verification import QUALITY_PY_PATHS; print(' '.join(p for p in QUALITY_PY_PATHS if Path(p).exists()))")
          ruff check --output-format github $paths
          bandit -c bandit.yaml -q -r $(printf '%s\n' $paths | grep -v '^tests') -f custom --msg-template '::error file={relpath},line={line}::{test_id} {msg}'
      - name: OpenGrep taint rules (the Trust CI engine)
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG OPENGREP_VERSION=//p' trust-ci/runner.Dockerfile)
          digest=$(sed -n 's/^ARG OPENGREP_SHA256=//p' trust-ci/runner.Dockerfile)
          mkdir -p "$RUNNER_TEMP/opengrep"
          curl -fsSL -o "$RUNNER_TEMP/opengrep/opengrep" "https://github.com/opengrep/opengrep/releases/download/v${version}/opengrep_manylinux_x86"
          echo "${digest}  $RUNNER_TEMP/opengrep/opengrep" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/opengrep/opengrep"
          export PATH="$RUNNER_TEMP/opengrep:$PATH"
          python -m unittest tests.test_opengrep
          python -c "import sys; sys.path.insert(0, '.getzilla'); from pathlib import Path; from getzilla.verification import _opengrep; r = _opengrep(Path('.')); print(r.status, r.summary); [print(d) for d in r.details]; sys.exit(r.status != 'pass')"
      - name: Core tests
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Trust CI tests
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s trust-ci/tests 2>&1 | tee "$RUNNER_TEMP/trust-ci-tests.log"
      - name: Annotate failing tests
        if: failure()
        shell: python
        run: |
          import os
          import pathlib
          import re

          for log in ("core-tests.log", "trust-ci-tests.log"):
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / log
              if not path.is_file():
                  continue
              blocks = re.split(r"^={50,}$", path.read_text(encoding="utf-8", errors="replace"), flags=re.MULTILINE)
              for block in blocks[1:41]:
                  lines = [line for line in block.strip().splitlines() if line.strip()]
                  if not lines:
                      continue
                  title = lines[0][:200]
                  detail = " | ".join(line.strip() for line in lines[-25:])[:6000]
                  print(f"::error title={log}::{title} -- {detail}".replace("\n", " "))
      - name: Export CI evidence
        id: export_evidence
        if: always()
        run: python scripts/getzilla_ci_evidence.py --output "${{ runner.temp }}/getzilla-evidence" --job linux-core --status "${{ job.status }}"
      - name: Retain CI evidence for 30 days
        if: always() && steps.export_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-linux-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/getzilla-evidence/
          retention-days: 30
          if-no-files-found: error

  live-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: factory
            job_timeout: 40
            main_timeout: 1500
          - cell: trust-ci
            job_timeout: 30
            main_timeout: 1200
          - cell: lifecycle
            job_timeout: 25
            main_timeout: 900
    steps:
      - name: Reserve cleanup and evidence time before any allocation
        shell: python
        env:
          JOB_MINUTES: ${{ matrix.job_timeout }}
        run: |
          import os, time
          deadline = int(time.time()) + int(os.environ['JOB_MINUTES']) * 60 - 300
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('GETZILLA_LIVE_DEADLINE=' + str(deadline) + '\n')
      - name: Check out the exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.4"
          enable-cache: false
      - name: Record capacity and load immutable component images
        shell: bash
        run: |
          set -euo pipefail
          python scripts/getzilla_startup_cpu.py --no-probe
          python - <<'PYTHON'
          import json, pathlib, subprocess, sys
          sys.path.insert(0, '.getzilla')
          from getzilla.disposable_resources import image_pins
          for name, pin in image_pins(pathlib.Path('.')).items():
              if not isinstance(pin, dict):
                  continue
              subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', pin['reference']], check=True, timeout=120)
              image = json.loads(subprocess.run(['docker', 'image', 'inspect', pin['reference']], check=True, capture_output=True, text=True, timeout=30).stdout)[0]
              if image['Id'] != pin['image_id'] or pin['reference'] not in image.get('RepoDigests', []):
                  raise SystemExit('pulled image does not match the approved manifest and configuration digests')
          PYTHON
      - name: Run bounded isolated acceptance with cleanup observer
        shell: bash
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: python scripts/getzilla_live.py --cell "${{ matrix.cell }}" --output "$RUNNER_TEMP/live-observations" --timeout-seconds "${{ matrix.main_timeout }}"
      - name: Export allowlisted live observations
        if: always()
        run: python scripts/getzilla_ci_evidence.py --live-source "${{ runner.temp }}/live-observations" --output "${{ runner.temp }}/live-evidence"
      - name: Retain live evidence for 30 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-live-${{ matrix.cell }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-evidence/
          retention-days: 30
          if-no-files-found: error

  security-expanded:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out candidate source as scan data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Select an exact checker from operator configuration or the base commit
        id: checker_ref
        shell: python
        env:
          OPERATOR_CHECKER: ${{ vars.GETZILLA_SECURITY_CHECKER_SHA }}
          BASE_CHECKER: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          import os, re
          override = os.environ['OPERATOR_CHECKER']
          ref = override or os.environ['BASE_CHECKER']
          if not re.fullmatch(r'[0-9a-f]{40}', ref) or ref == '0' * 40:
              raise SystemExit('BLOCKED: exact trusted checker ref is not configured')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + ref + '\n')
              stream.write('selection=' + ('operator-variable' if override else 'base-commit') + '\n')
      - name: Check out the selected checker separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Dimkox/Getzilla
          ref: ${{ steps.checker_ref.outputs.sha }}
          path: trusted-checker
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify checker identity and install trusted quality tools
        shell: bash
        env:
          CHECKER_REF: ${{ steps.checker_ref.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted-checker rev-parse HEAD)" = "$CHECKER_REF"
          test -f trusted-checker/scripts/getzilla_security.py || { echo 'BLOCKED: reviewed checker bootstrap is incomplete'; exit 1; }
          python -I -m pip install --disable-pip-version-check -r trusted-checker/.getzilla/config/python-quality-requirements.txt
      - name: Run all expanded checks with trusted tools and fresh security data
        timeout-minutes: 30
        shell: bash
        run: |
          python -I trusted-checker/scripts/getzilla_security.py --root "$GITHUB_WORKSPACE/candidate" --database "$RUNNER_TEMP/security-data" --artifacts "$RUNNER_TEMP/security-artifacts" --tools "$RUNNER_TEMP/security-tools" --refresh --provision-tools --json-out "$RUNNER_TEMP/security-expanded.json"
      - name: Bind scanner observations to this workflow and source
        if: always()
        shell: bash
        env:
          CHECKER_REF: ${{ steps.checker_ref.outputs.sha }}
          CHECKER_SELECTION: ${{ steps.checker_ref.outputs.selection }}
        run: |
          python candidate/scripts/getzilla_ci_admission.py --security-envelope --root "$GITHUB_WORKSPACE/candidate" --checker "$GITHUB_WORKSPACE/trusted-checker" --checker-ref "$CHECKER_REF" --checker-selection "$CHECKER_SELECTION" --report "$RUNNER_TEMP/security-expanded.json" --output "$RUNNER_TEMP/security-evidence"
      - name: Retain expanded security evidence for 30 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-security-expanded-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-evidence/
          retention-days: 30
          if-no-files-found: error

  linux:
    needs: [linux-core, live-acceptance, security-expanded]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact source for evidence validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Download only evidence from this run and attempt
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: getzilla-*-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/required-evidence
      - name: Require all jobs and bound evidence before the existing linux check passes
        if: always()
        env:
          GETZILLA_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/getzilla_ci_admission.py --artifacts "${{ runner.temp }}/required-evidence"

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep checkout bytes and executable bits as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Record startup capacity
        run: python scripts/getzilla_startup_cpu.py --no-probe
      - name: Doctor
        run: python scripts/getzilla_doctor.py
      - name: Windows-ported tests
        run: python -m unittest tests.test_fsx tests.test_install_scripts tests.test_workflow_sources tests.test_ci_gate tests.test_review_source
      - name: Hooks and CLI smoke
        env:
          GETZILLA_SESSION_ID: ci
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          set -x
          workspace="$RUNNER_TEMP/smoke"
          git clone --quiet . "$workspace"
          cd "$workspace"
          git config user.name smoke
          git config user.email smoke@example.invalid
          prompt='{"prompt":"Add a health endpoint to the API","session_id":"ci","hook_event_name":"UserPromptSubmit"}'
          echo "$prompt" | python .grok/hooks/session_start.py
          echo "$prompt" | python .grok/hooks/user_prompt_submit.py
          echo '{"session_id":"ci","tool_name":"Bash","tool_input":{"command":"git push origin main"},"hook_event_name":"PreToolUse"}' \
            | python .grok/hooks/pre_tool_use.py | tee "$RUNNER_TEMP/pre.json"
          grep -q '"deny"' "$RUNNER_TEMP/pre.json"
          for hook in post_tool_use pre_compact stop_gate subagent_start subagent_stop session_end; do
            echo '{"session_id":"ci","hook_event_name":"Smoke"}' | python ".grok/hooks/$hook.py"
          done
          python scripts/getzilla_route.py --show
          python scripts/getzilla_change.py start --title "Health endpoint"
          python scripts/getzilla_status.py > /dev/null
          python scripts/getzilla_architecture.py validate
          python scripts/getzilla_architecture.py drift
          python scripts/getzilla_architecture.py diagram --check
          python scripts/getzilla_governance.py validate
          python scripts/generate_manifest.py
          python scripts/verify_manifest.py
          python scripts/getzilla_ci.py --plan --visibility public
          python scripts/install_into.py --plan "$RUNNER_TEMP/plan-target" > /dev/null
          python scripts/install_into.py --materialize-new "$RUNNER_TEMP/new-target" > /dev/null
          cd "$RUNNER_TEMP/new-target"
          python scripts/getzilla_doctor.py
      - name: Annotate smoke failure
        if: failure()
        shell: python
        run: |
          import os
          import pathlib

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "smoke.log"
          if path.is_file():
              lines = [line for line in path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
              print("::error title=windows-smoke::" + " | ".join(line.strip() for line in lines[-40:])[:8000])
      - name: Export CI evidence
        id: export_evidence
        if: always()
        run: python scripts/getzilla_ci_evidence.py --output "${{ runner.temp }}/getzilla-evidence" --job windows --status "${{ job.status }}"
      - name: Retain CI evidence for 30 days
        if: always() && steps.export_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/getzilla-evidence/
          retention-days: 30
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Installer from this commit (non-interactive, no agent)
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/install.log") 2>&1
          git config user.name ci
          git config user.email ci@example.invalid
          git branch -f ci-macos-install HEAD
          GETZILLA_NONINTERACTIVE=1 GETZILLA_SKIP_AGENT=1 GETZILLA_EU_AI_ACT=0 \
            GETZILLA_REPO="file://$GITHUB_WORKSPACE" GETZILLA_REF=ci-macos-install \
            GETZILLA_HOME="$RUNNER_TEMP/getzilla-home" GETZILLA_NEW_PROJECT="$RUNNER_TEMP/new-project" \
            bash scripts/install.sh
          test "$(git -C "$RUNNER_TEMP/getzilla-home" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          "$HOME/.local/bin/getzilla" help > /dev/null
      - name: Hooks and CLI smoke in the installed project
        env:
          GETZILLA_SESSION_ID: ci
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          set -x
          cd "$RUNNER_TEMP/new-project"
          git init -q 2>/dev/null || true
          git config user.name smoke
          git config user.email smoke@example.invalid
          prompt='{"prompt":"Add a health endpoint to the API","session_id":"ci","hook_event_name":"UserPromptSubmit"}'
          echo "$prompt" | python3 .grok/hooks/session_start.py
          echo "$prompt" | python3 .grok/hooks/user_prompt_submit.py
          echo '{"session_id":"ci","tool_name":"Bash","tool_input":{"command":"git push origin main"},"hook_event_name":"PreToolUse"}' \
            | python3 .grok/hooks/pre_tool_use.py | tee "$RUNNER_TEMP/pre.json"
          grep -q '"deny"' "$RUNNER_TEMP/pre.json"
          for hook in post_tool_use pre_compact stop_gate subagent_start subagent_stop session_end; do
            echo '{"session_id":"ci","hook_event_name":"Smoke"}' | python3 ".grok/hooks/$hook.py"
          done
          python3 scripts/getzilla_doctor.py
          python3 scripts/getzilla_route.py --show
          python3 scripts/getzilla_status.py > /dev/null
      - name: Record startup capacity
        run: python scripts/getzilla_startup_cpu.py --no-probe
      - name: Install test requirements
        if: success() || failure()
        run: |
          python -m pip install --disable-pip-version-check -r .getzilla/config/python-test-requirements.txt
          cp -R trust-ci "$RUNNER_TEMP/trust-ci-source"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/trust-ci-source[test]" ruff==0.16.3 bandit==1.9.4 tomli==2.4.1
      - name: Core tests on macOS
        if: success() || failure()
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Annotate macOS failures
        if: failure()
        shell: python
        run: |
          import os
          import pathlib
          import re

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("install.log", "smoke.log"):
              path = temp / name
              if path.is_file():
                  lines = [line for line in path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
                  print(f"::error title=macos-{name}::" + " | ".join(line.strip() for line in lines[-40:])[:8000])
          path = temp / "core-tests.log"
          if path.is_file():
              text = path.read_text(encoding="utf-8", errors="replace")
              for block in re.split(r"\n(?==+\n(?:FAIL|ERROR): )", text)[1:60]:
                  lines = [line for line in block.splitlines() if line.strip() and not line.startswith("=")]
                  if lines:
                      print("::error title=macos-test::" + " | ".join(line.strip() for line in lines[:2] + lines[-12:])[:4000])
      - name: Export CI evidence
        id: export_evidence
        if: always()
        run: python scripts/getzilla_ci_evidence.py --output "${{ runner.temp }}/getzilla-evidence" --job macos --status "${{ job.status }}"
      - name: Retain CI evidence for 30 days
        if: always() && steps.export_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: getzilla-macos-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/getzilla-evidence/
          retention-days: 30
          if-no-files-found: error
