# Getzilla's own CI/merge gate.
#
# The gate follows repository visibility (owner decision 2026-10-06): a public
# repository is gated by GitHub Actions, a private repository by the
# self-hosted Trust CI GitHub App (adaptive-trust-ci, code in trust-ci/).
# Getzilla is public, so this workflow is its gate. Consumer repositories get
# their own workflow from `python3 scripts/getzilla_ci.py --write`. The
# windows job runs the native Windows port: doctor, the ported test modules
# and a smoke of the hooks and CLIs. The informational module-by-module core
# suite on Windows runs nightly in windows-full-suite.yml, not on PRs.
# The macos job runs the real installer from this commit (non-interactive,
# no coding agent), smokes the hooks and CLIs in the project it creates, and
# runs the core suite on macOS.
name: getzilla

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test requirements
        shell: bash
        run: |
          if [ -f .getzilla/config/python-test-requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r .getzilla/config/python-test-requirements.txt
          fi
          cp -R trust-ci "$RUNNER_TEMP/trust-ci-source"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/trust-ci-source[test]" ruff==0.16.2 bandit==1.9.4 tomli==2.4.1
      - name: Known vulnerabilities in pinned dependencies (OSV)
        run: python scripts/getzilla_vulns.py --online
      - name: Static checks as the verifier runs them
        shell: bash
        run: |
          paths=$(python -c "import sys; sys.path.insert(0, '.getzilla'); from pathlib import Path; from getzilla.verification import QUALITY_PY_PATHS; print(' '.join(p for p in QUALITY_PY_PATHS if Path(p).exists()))")
          ruff check --output-format github $paths
          bandit -c bandit.yaml -q -r $(printf '%s\n' $paths | grep -v '^tests') -f custom --msg-template '::error file={relpath},line={line}::{test_id} {msg}'
      - name: OpenGrep taint rules (the Trust CI engine)
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG OPENGREP_VERSION=//p' trust-ci/runner.Dockerfile)
          digest=$(sed -n 's/^ARG OPENGREP_SHA256=//p' trust-ci/runner.Dockerfile)
          mkdir -p "$RUNNER_TEMP/opengrep"
          curl -fsSL -o "$RUNNER_TEMP/opengrep/opengrep" "https://github.com/opengrep/opengrep/releases/download/v${version}/opengrep_manylinux_x86"
          echo "${digest}  $RUNNER_TEMP/opengrep/opengrep" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/opengrep/opengrep"
          export PATH="$RUNNER_TEMP/opengrep:$PATH"
          python -m unittest tests.test_opengrep
          python -c "import sys; sys.path.insert(0, '.getzilla'); from pathlib import Path; from getzilla.verification import _opengrep; r = _opengrep(Path('.')); print(r.status, r.summary); [print(d) for d in r.details]; sys.exit(r.status != 'pass')"
      - name: Core tests
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Trust CI tests
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s trust-ci/tests 2>&1 | tee "$RUNNER_TEMP/trust-ci-tests.log"
      - name: Annotate failing tests
        if: failure()
        shell: python
        run: |
          import os
          import pathlib
          import re

          for log in ("core-tests.log", "trust-ci-tests.log"):
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / log
              if not path.is_file():
                  continue
              blocks = re.split(r"^={50,}$", path.read_text(encoding="utf-8", errors="replace"), flags=re.MULTILINE)
              for block in blocks[1:41]:
                  lines = [line for line in block.strip().splitlines() if line.strip()]
                  if not lines:
                      continue
                  title = lines[0][:200]
                  detail = " | ".join(line.strip() for line in lines[-25:])[:6000]
                  print(f"::error title={log}::{title} -- {detail}".replace("\n", " "))

  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep checkout bytes and executable bits as committed
        run: |
          git config --global core.autocrlf false
          git config --global core.filemode false
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Doctor
        run: python scripts/getzilla_doctor.py
      - name: Windows-ported tests
        run: python -m unittest tests.test_fsx tests.test_install_scripts tests.test_workflow_sources tests.test_ci_gate tests.test_review_source
      - name: Hooks and CLI smoke
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          set -x
          workspace="$RUNNER_TEMP/smoke"
          git clone --quiet . "$workspace"
          cd "$workspace"
          git config user.name smoke
          git config user.email smoke@example.invalid
          prompt='{"prompt":"Add a health endpoint to the API","session_id":"ci","hook_event_name":"UserPromptSubmit"}'
          echo "$prompt" | python .grok/hooks/session_start.py
          echo "$prompt" | python .grok/hooks/user_prompt_submit.py
          echo '{"session_id":"ci","tool_name":"Bash","tool_input":{"command":"git push origin main"},"hook_event_name":"PreToolUse"}' \
            | python .grok/hooks/pre_tool_use.py | tee "$RUNNER_TEMP/pre.json"
          grep -q '"deny"' "$RUNNER_TEMP/pre.json"
          for hook in post_tool_use pre_compact stop_gate subagent_start subagent_stop session_end; do
            echo '{"session_id":"ci","hook_event_name":"Smoke"}' | python ".grok/hooks/$hook.py"
          done
          python scripts/getzilla_route.py --show
          python scripts/getzilla_change.py start --title "Health endpoint"
          python scripts/getzilla_status.py > /dev/null
          python scripts/getzilla_architecture.py validate
          python scripts/getzilla_architecture.py drift
          python scripts/getzilla_architecture.py diagram --check
          python scripts/getzilla_governance.py validate
          python scripts/generate_manifest.py
          python scripts/verify_manifest.py
          python scripts/getzilla_ci.py --plan --visibility public
          python scripts/install_into.py --plan "$RUNNER_TEMP/plan-target" > /dev/null
          python scripts/install_into.py --materialize-new "$RUNNER_TEMP/new-target" > /dev/null
          cd "$RUNNER_TEMP/new-target"
          python scripts/getzilla_doctor.py
      - name: Annotate smoke failure
        if: failure()
        shell: python
        run: |
          import os
          import pathlib

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "smoke.log"
          if path.is_file():
              lines = [line for line in path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
              print("::error title=windows-smoke::" + " | ".join(line.strip() for line in lines[-40:])[:8000])

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Installer from this commit (non-interactive, no agent)
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/install.log") 2>&1
          git config user.name ci
          git config user.email ci@example.invalid
          git branch -f ci-macos-install HEAD
          GETZILLA_NONINTERACTIVE=1 GETZILLA_SKIP_AGENT=1 GETZILLA_EU_AI_ACT=0 \
            GETZILLA_REPO="file://$GITHUB_WORKSPACE" GETZILLA_REF=ci-macos-install \
            GETZILLA_HOME="$RUNNER_TEMP/getzilla-home" GETZILLA_NEW_PROJECT="$RUNNER_TEMP/new-project" \
            bash scripts/install.sh
          test "$(git -C "$RUNNER_TEMP/getzilla-home" rev-parse HEAD)" = "$(git rev-parse HEAD)"
          "$HOME/.local/bin/getzilla" help > /dev/null
      - name: Hooks and CLI smoke in the installed project
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/smoke.log") 2>&1
          set -x
          cd "$RUNNER_TEMP/new-project"
          git init -q 2>/dev/null || true
          git config user.name smoke
          git config user.email smoke@example.invalid
          prompt='{"prompt":"Add a health endpoint to the API","session_id":"ci","hook_event_name":"UserPromptSubmit"}'
          echo "$prompt" | python3 .grok/hooks/session_start.py
          echo "$prompt" | python3 .grok/hooks/user_prompt_submit.py
          echo '{"session_id":"ci","tool_name":"Bash","tool_input":{"command":"git push origin main"},"hook_event_name":"PreToolUse"}' \
            | python3 .grok/hooks/pre_tool_use.py | tee "$RUNNER_TEMP/pre.json"
          grep -q '"deny"' "$RUNNER_TEMP/pre.json"
          for hook in post_tool_use pre_compact stop_gate subagent_start subagent_stop session_end; do
            echo '{"session_id":"ci","hook_event_name":"Smoke"}' | python3 ".grok/hooks/$hook.py"
          done
          python3 scripts/getzilla_doctor.py
          python3 scripts/getzilla_route.py --show
          python3 scripts/getzilla_status.py > /dev/null
      - name: Install test requirements
        if: success() || failure()
        run: |
          python -m pip install --disable-pip-version-check -r .getzilla/config/python-test-requirements.txt
          cp -R trust-ci "$RUNNER_TEMP/trust-ci-source"
          python -m pip install --disable-pip-version-check "$RUNNER_TEMP/trust-ci-source[test]" ruff==0.16.2 bandit==1.9.4 tomli==2.4.1
      - name: Core tests on macOS
        if: success() || failure()
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
      - name: Diagnose macOS refusals
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cat > "$RUNNER_TEMP/diag/sitecustomize.py" <<'PY'
          import sys
          def _hook():
              try:
                  import os
                  sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], '.getzilla'))
                  from getzilla import verification, architecture_diff, governance
              except Exception as exc:
                  print('DIAG import failed', exc, file=sys.stderr); return
              add = verification._CheckDispatch.add
              def traced(self, check):
                  before = self.blocked_by
                  result = add(self, check)
                  if before is None and self.blocked_by:
                      print('DIAG refused', check.name, check.status, check.summary, str(check.details)[:1500], check.stdout[-800:], check.stderr[-800:], file=sys.stderr)
                  return result
              verification._CheckDispatch.add = traced
              run = governance.run_git_bounded
              def git_traced(*args, **kwargs):
                  try:
                      return run(*args, **kwargs)
                  except Exception as exc:
                      print('DIAG git', args[1:], kwargs.get('limit'), type(exc).__name__, getattr(exc, 'code', None), exc, file=sys.stderr)
                      raise
              governance.run_git_bounded = git_traced
              from getzilla import workflow_artifacts
              acquire = workflow_artifacts._acquire_cas_lock
              def lock_traced(*args, **kwargs):
                  try:
                      return acquire(*args, **kwargs)
                  except Exception as exc:
                      print('DIAG cas-lock', type(exc).__name__, exc, repr(exc.__cause__), file=sys.stderr)
                      raise
              workflow_artifacts._acquire_cas_lock = lock_traced
          _hook()
          PY
          PYTHONPATH="$RUNNER_TEMP/diag" python -m unittest discover -s tests -k FocusedPython -k VerifyDocsState -k test_python_pr_does_not_trust -k test_git_output_is_capped -k test_concurrent_cooperating_writers 2>&1 | grep -E 'DIAG|^(FAIL|ERROR):' | sort | uniq -c | head -80 || true
      - name: Annotate macOS failures
        if: failure()
        shell: python
        run: |
          import os
          import pathlib
          import re

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name in ("install.log", "smoke.log"):
              path = temp / name
              if path.is_file():
                  lines = [line for line in path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
                  print(f"::error title=macos-{name}::" + " | ".join(line.strip() for line in lines[-40:])[:8000])
          path = temp / "core-tests.log"
          if path.is_file():
              text = path.read_text(encoding="utf-8", errors="replace")
              for block in re.split(r"\n(?==+\n(?:FAIL|ERROR): )", text)[1:60]:
                  lines = [line for line in block.splitlines() if line.strip() and not line.startswith("=")]
                  if lines:
                      print("::error title=macos-test::" + " | ".join(line.strip() for line in lines[:2] + lines[-12:])[:4000])
